# 공공데이터포털 파일데이터 — 철도 안전·운영·수송 통계 (P2-2·P2-3, 레인 E 2026-10-27). `rra ingest --source datago`. 키 불필요.
# 데이터셋 페이지(/data/<pk>/fileData.do)에 "로그인 없이 다운로드"·"이용허락범위 제한 없음" 표기. robots 는 Googlebot 일부 경로만.
# topic: safety(안전) | transport(수송·운영). label 은 표시용. pk 는 공공데이터포털 데이터셋 번호 (2026-10-27 검색 결과).
base_url: https://www.data.go.kr
store_dir: data/datago
max_file_mb: 50
max_rows: 400                   # 본문에 넣는 표 행 수 상한 (나머지는 행 수만 표기)
rate_limit: 0.5                 # 2초 간격
max_requests_per_run: 120
retries: 2
max_response_mb: 50
timeout: {connect: 10, read: 60}
datasets:
  # 안전 통계 (P2-2)
  - {pk: 15122753, topic: safety, label: 국토교통부_철도사고 발생 현황}              # CSV 79행, 2024-09-04 확인(16KB)
