# 분석 기법 인포그래픽 목록 [11] (2026-10-28, ADR 0033). 초안이 만들어진 뒤 Argon 이 본문·입력·근거를 읽고
# 이 제안에 의미 있는 분석이 나오는 기법만 0~2개 고른 뒤, 제안 내용으로 실제 분석해 그림으로 그린다(맞는 기법이 없으면 "해당 없음").
#
# family — 분석 규칙(domain/rules/techniques.py):
#   qualitative  정성: 항목은 본문·근거에서 뽑고 항목마다 강도 상·중·하
#   evaluation   비교·평가: 제안의 대안·기준·위험을 평가, 칸은 scale(pm = +/0/−, level = 상·중·하), "제안 내용 기반 예비 평가"
#   economic     경제성·확률: 제안·근거에 있는 수치로만, 없으면 금액 칸 "산출 필요"
#   procedure    연구 절차: 방법의 단계·대상·기준을 본문에서 정리 (등급 없음)
# 모든 항목은 어느 본문 문장(s:<섹션>:<n>)·근거(청크 id)·입력 칸(input:<칸>)에서 왔는지 source 를 남긴다.
# groups: 고정 묶음 이름(그림 머리글). free_groups: true 면 묶음 이름을 제안 내용(대안·시나리오 이름)에서 쓴다.
# columns: 비교·평가 표의 고정 열(앞쪽). free_columns: true 면 나머지 열은 제안의 대안 이름.
# section: 그림이 붙는 양식 칸. min_groups: 최소 묶음 수(기본 = groups 개수).
# arrange [23]: 그림 배치 — 모두 가로로 넓게(16:9·21:9). row = 묶음을 가로 한 줄(SWOT 네 칸 한 줄), split = 좌우 두 단
#   (비용 | 편익, 추진력 | 저항력), flow = 한 줄 + 오른쪽 화살표(절차·투입→산출), grid = 가로 두 줄(묶음 5개 이상),
#   table = 비교·평가 표(열 = 대안). 밑그림(adapters/figures)과 그림 프롬프트(rules.figures._layout_hint)가 같은 배치.

techniques:
  - key: swot
    label: SWOT 분석
    family: qualitative
    arrange: row
    section: tech_importance
    groups: [강점, 약점, 기회, 위협]
    summary: 연구 대상(기술·조직·사업)의 내부 강점·약점과 외부 기회·위협을 네 칸으로 정리한다.
    fits: 공사 보유 역량·자료와 외부 환경(정책·기술 동향)이 본문·근거에 함께 있을 때. 연구 필요성을 구조적으로 보일 때.

  - key: tows
    label: TOWS 전략 매트릭스
    family: qualitative
    arrange: row
    section: method
    groups: [SO 전략, WO 전략, ST 전략, WT 전략]
    summary: SWOT 의 내부·외부 요인을 짝지어 강점-기회(SO)·약점-기회(WO)·강점-위협(ST)·약점-위협(WT) 전략을 도출한다.
    fits: 본문이 강점·약점과 기회·위협을 모두 다루고, 연구 방법이 그 대응 전략으로 읽힐 때.

  - key: pmi
    label: PMI 분석
    family: qualitative
    arrange: row
    section: tech_importance
    groups: [Plus(장점), Minus(단점), Interesting(흥미로운 점)]
    summary: 제안하는 방안의 장점·단점·흥미로운 점(추가 검토 거리)을 나눠 본다.
    fits: 새 방식 도입 제안으로 장단점이 본문에 드러나 있을 때. 대안이 하나뿐일 때.

  - key: force_field
    label: 역장분석(Force Field)
    family: qualitative
    arrange: split
    section: tech_importance
    groups: [추진력, 저항력]
    summary: 변화(연구 결과 적용)를 밀어 주는 힘과 가로막는 힘을 양쪽에 놓고 강도를 비교한다.
    fits: 현장 적용·제도 변경을 목표로 하고, 적용을 돕는 요인과 걸림돌이 본문·근거에 있을 때.

  - key: six_hats
    label: 6색 사고모자
    family: qualitative
    arrange: grid
    section: method
    groups: [하양(사실), 빨강(직관), 검정(위험), 노랑(이점), 초록(대안), 파랑(진행)]
    min_groups: 4
    summary: 사실·직관·위험·이점·대안·진행 관점으로 같은 주제를 나눠 검토한다.
    fits: 이해관계자 관점이 여럿이고 위험과 이점이 함께 논의되는 과제. 아이디어 검토형 과제.

  - key: pestel
    label: PEST(EL) 분석
    family: qualitative
    arrange: grid
    section: tech_importance
    groups: [정치, 경제, 사회, 기술, 환경, 법·제도]
    min_groups: 4
    summary: 정치·경제·사회·기술(·환경·법제도) 외부 환경 요인을 정리한다.
    fits: 정책·법령·시장·기술 동향 근거가 많고 거시 환경이 연구 필요성의 핵심일 때.

  - key: weighted_matrix
    label: 가중치 평가 매트릭스
    family: evaluation
    arrange: table
    section: method
    scale: level
    columns: [가중치]
    free_columns: true
    summary: 평가 기준마다 가중치를 두고 대안별 점수를 매겨 비교한다.
    fits: 본문에 대안(현행·제안 방식 등) 2개 이상과 비교 기준(비용·정확도·안전성 등)이 있을 때.

  - key: pugh
    label: 퓨 매트릭스(Pugh)
    family: evaluation
    arrange: table
    section: method
    scale: pm
    free_columns: true
    summary: 기준안(현행 방식) 대비 각 대안이 기준마다 나은지(+)·같은지(0)·못한지(−)를 표시한다.
    fits: 현행 방식과 제안 방식(또는 여러 기술 대안)을 같은 기준으로 비교할 수 있을 때.

  - key: ahp
    label: AHP(계층분석)
    family: evaluation
    arrange: table
    section: method
    scale: level
    columns: [중요도]
    free_columns: true
    summary: 목표 → 평가 기준 → 대안의 계층을 세우고 기준 중요도와 대안 선호를 비교한다.
    fits: 의사결정 기준이 여럿이고 기준 사이 중요도 판단이 필요한 선정·우선순위 과제.

  - key: topsis
    label: TOPSIS
    family: evaluation
    arrange: table
    section: method
    scale: level
    free_columns: true
    summary: 대안마다 이상적인 해와의 가까움·가장 나쁜 해와의 멀어짐을 기준별로 견준다.
    fits: 대안 3개 안팎과 정량 기준이 있는 선정·우선순위 과제(값이 없으면 상·중·하 예비 평가).

  - key: fmea
    label: FMEA(고장모드·영향분석)
    family: evaluation
    arrange: table
    section: method
    scale: level
    columns: [심각도, 발생도, 검출 난이도]
    summary: 고장·위험 유형마다 심각도·발생도·검출 난이도를 매겨 우선 대응할 위험을 찾는다.
    fits: 설비·시스템·안전 과제로 본문·근거에 고장 유형·위험 요인이 나올 때.

  - key: cost_benefit
    label: 비용-편익 분석
    family: economic
    arrange: split
    section: expected_management
    groups: [비용, 편익]
    summary: 연구·적용에 드는 비용과 얻는 편익을 항목별로 나누고 금액으로 견준다.
    fits: 유지보수비 절감·인력 절감 같은 경영 효과가 기대효과에 있을 때. 금액이 없으면 항목만 정리.

  - key: cost_effectiveness
    label: 비용-효과 분석
    family: economic
    arrange: split
    section: expected_management
    groups: [비용, 효과]
    summary: 비용 대비 금액으로 바꾸기 어려운 효과(안전도·정확도·시간)를 견준다.
    fits: 효과가 안전·품질 지표라 금액 환산이 어려울 때.

  - key: lcc
    label: 생애주기비용(LCC)
    family: economic
    arrange: flow
    section: expected_management
    groups: [초기 투자비, 운영·유지비, 교체·폐기비]
    min_groups: 2
    summary: 도입부터 폐기까지 전 기간 비용을 단계별로 나눠 본다.
    fits: 설비·시스템 도입·교체 과제로 수명 기간 비용 구조가 쟁점일 때.

  - key: sensitivity
    label: 민감도 분석
    family: economic
    arrange: flow
    section: expected_management
    groups: [주요 변수, 영향 받는 결과]
    summary: 핵심 변수(단가·수요·고장률 등)가 바뀔 때 결과가 얼마나 달라지는지 본다.
    fits: 효과 추정이 불확실한 변수에 크게 좌우될 때.

  - key: decision_tree
    label: 의사결정나무
    family: economic
    arrange: flow
    section: method
    free_groups: true
    min_groups: 2
    summary: 대안별로 일어날 수 있는 결과와 확률·기대값을 가지로 나눠 비교한다.
    fits: 단계별 선택(도입·보류·시범 적용 등)과 그 결과가 본문에 나올 때.

  - key: scenario
    label: 시나리오 분석
    family: economic
    arrange: row
    section: expected_management
    groups: [낙관 시나리오, 기준 시나리오, 비관 시나리오]
    min_groups: 2
    summary: 미래 조건을 몇 개의 시나리오로 나눠 각각의 결과를 견준다.
    fits: 정책·수요·기술 변화에 따라 결과가 크게 갈릴 때.

  - key: dea
    label: DEA(자료포락분석)
    family: economic
    arrange: flow
    section: method
    groups: [투입 요소, 산출 요소]
    summary: 여러 단위(사업소·노선·설비)의 투입 대비 산출 효율을 비교한다.
    fits: 같은 종류 단위 여럿의 효율 비교가 연구 내용일 때.

  - key: delphi
    label: 델파이 기법
    family: procedure
    arrange: flow
    section: method
    groups: [전문가 패널, 조사 라운드, 합의 기준]
    min_groups: 2
    summary: 전문가 의견을 여러 차례 익명으로 모아 합의에 이르게 한다.
    fits: 연구 방법에 전문가 자문·설문이 있고 정량 자료가 부족한 지표·기준 설정 과제.

  - key: systematic_review
    label: 체계적 문헌고찰·메타분석
    family: procedure
    arrange: flow
    section: method
    groups: [검색 범위, 선정 기준, 분석·종합]
    min_groups: 2
    summary: 정해진 검색·선정 기준으로 선행연구를 모으고 결과를 종합한다.
    fits: 연구 방법에 선행연구·사례 조사가 핵심 단계로 들어 있을 때.
