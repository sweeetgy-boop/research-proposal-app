# provider·base_url 은 환경변수(RRA_LLM_PROVIDER, RRA_LLM_BASE_URL)가 있으면 그쪽이 이깁니다
# (기본 provider 에만 적용). api_key 는 여기 두지 않습니다. settings.py(.env)에서만 옵니다 (보안 D):
#   mlx → 키 없음, openai → RRA_LLM_API_KEY, gemini → RRA_GEMINI_API_KEY.
provider: mlx            # 기본 provider (stages 에서 provider 를 안 적은 단계가 쓴다)

# provider 별 접속 정보. 원격 provider 는 base_url 호스트가 security.yaml allowed_domains 에 있어야 기동한다 (보안 C).
# H: provider=mlx 면 base_url 이 127.0.0.1/localhost 가 아닐 때 기동을 거부합니다.
providers:
  mlx:
    base_url: http://127.0.0.1:8080/v1
    # 로컬 작성 모델은 model_profiles 중 하나로 고른다 (served_model·model·json_mode·system_role·stop 은
    # 프로필에서 온다). 환경변수 RRA_LLM_PROFILE 이 있으면 그쪽이 이긴다 (벤치·되돌리기용).
    model_profile: qwen
  gemini:                # Gemini 4 Argon — OpenAI 호환 엔드포인트 (검토 단계)
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    model: gemini-4-argon
    served_model: gemini-4-argon
    # 그림 생성(Nano Banana Pro, config/figures.yaml) — generateContent 이미지 출력. base_url 의 /openai/ 를 뗀 네이티브 경로를 쓴다
    image_model: gemini-3-pro-image
    # auto: response_format(json_object) 먼저, 거부(오류)하면 프롬프트 폴백. 실응답 확인 전 기본값.
    json_mode: auto
    # 추론 노력 low|medium|high (none 금지). thinking_level 과 동시 전송 금지 — 어댑터가 거부한다.
    reasoning_effort: low
    # 프로세스 내 공유 호출 제한기 (adapters/llm/rate_limiter): 같은 provider 의 모든 단계(검토·차별화·추천·판독)가
    # 하나를 쓴다. 동시 요청 수·분당 시작 수·429 지수 백오프(Retry-After 우선). 프로세스 간 제한은 통합 세션 큐.
    rate: {concurrency: 4, per_minute: 60}
  openai:
    base_url: https://api.openai.com/v1
    model: gpt-4o-mini
    json_mode: auto

# 로컬 모델 프로필 — 채팅 템플릿 차이(system 역할 유무·stop 토큰·json_mode)는 코드 분기 대신 여기서.
# served_model: manifest 에 기록할 실제 모델 이름(`mlx_lm.server --model` 에 준 값과 같게). rra llm-check 가
#   /v1/models 목록에 있는지 확인한다(경고만). 로컬 경로면 절대경로도 같은 것으로 본다.
# model: 요청에 보내는 이름. mlx_lm.server 는 "default_model" 이면 기동 시 --model 로 띄운 모델을 쓴다.
# json_mode: mlx_lm.server 는 response_format 을 오류 없이 무시하므로 auto 로는 폴백이 안 일어난다 → prompt.
# system_role: false 면 시스템 프롬프트를 첫 user 메시지 앞에 붙인다 (system 역할이 없는 템플릿).
# stop: 서버 템플릿이 끝내지 못할 때 보낼 추가 stop 문자열. context_length: 최대 문맥(토큰, 벤치 보고용).
model_profiles:
  qwen:                        # 되돌리기용 — 2026-10 까지의 기본
    served_model: mlx-community/Qwen2.5-7B-Instruct-4bit
    model: default_model
    json_mode: prompt
    system_role: true
    stop: []
    context_length: 32768
  midm:                        # KT Mi:dm 2.0 Base Instruct (11.5B, MIT, Llama 구조, 문맥 32K).
                               # 벤치 탈락(2026-10-26): JSON 형식 성공률 3.5%, 2.6× 느림 — docs/llm-bench-2026-10-26.md.
                               # 변환본은 지웠다. 다시 쓰려면 ~/models/midm-2.0-base-4bit 로 재변환.
    served_model: ~/models/midm-2.0-base-4bit
    model: default_model
    json_mode: prompt
    system_role: true
    stop: ["<|eot_id|>", "<|end_of_text|>"]
    context_length: 32768
  ax_light:                    # SKT A.X 4.0 Light (7B, Apache 2.0, Qwen2 구조, 문맥 16K) → ~/models 4bit
    served_model: ~/models/ax-4.0-light-4bit
    model: default_model
    json_mode: prompt
    system_role: true
    stop: ["<|im_end|>"]
    context_length: 16384

# 공통 (provider 표·프로필에 없는 값의 기본)
json_mode: auto
temperature: 0.2

timeout:                 # 초
  connect: 5
  # 2026-10-28 밤(ADR 0038): 응답 시간 제한을 두지 않는다 — 앱이 정한 제한(판정 40초·로컬 검토 20초·버튼 180초)은
  # 없앴고, 이 값은 "통신이 10분 동안 한 바이트도 오지 않음 = 연결 오류" 를 가리는 안전선이다(그때만 오류 → 재시도·로컬).
  # 화면은 기다리는 동안 경과 초와 [취소]를 보인다(취소 = 브라우저가 요청을 끊음 → 서버 작업도 멈춤)
  read: 600
  write: 10
  pool: 5

retries:                 # 429·5xx·타임아웃만 재시도. 401/403 은 재시도 없이 사용자 메시지.
  attempts: 3
  backoff_sec: 0.5
  max_backoff_sec: 8

limits:                  # DoS·메모리 보호 상한
  max_tokens_cap: 8192
  prompt_max_chars: 120000

budget:                  # 외부(gemini) LLM 일일 전체 호출 상한 (레인 A). 넘으면 검토 없이 진행하고 화면에 알린다.
  # 2026-10-28 300 → 600: Argon 이 초안을 먼저 쓰면(compose.writer) 한 건에 섹션 수만큼(+교정 재요청) 더 든다 (ADR 0032)
  gemini_daily_calls: 600
  counter: data/cache/llm_budget.json   # {"date","count"} — API·CLI·MCP 가 같은 파일을 본다

# 단계별 설정. provider 를 적지 않으면 기본 provider. model 을 적지 않으면 provider 표의 model.
stages:
  expand:    {max_tokens: 512}
  summarize: {max_tokens: 400}
  # 작성 = mlx(model_profiles 의 로컬 모델). fallback: 로컬 교정 재요청까지 실패한 섹션만 그 provider 가
  # 대신 쓴다(ADR 0027, 시범 기본 켬). 키가 없으면 자동 끔. 전송 범위는 external_llm.include_internal,
  # 일일 예산(budget.gemini_daily_calls) 카운터를 거친다. manifest fallback_sections 에 키·사유·전송 doc_id 기록
  # writer: gemini 일 때는 이 단계 설정(max_tokens)으로 provider 만 gemini 로 바꿔 부른다 — 위 compose 정책 참고
  compose:   {max_tokens: 2000, fallback: gemini}
  critique:  {max_tokens: 800}
  review:    {provider: gemini, max_tokens: 6000}     # 검토 = gemini-4-argon (키 없으면 review_skipped)
  # 기능 2 유사과제 활용·차별화 제안 = 검토와 같은 Gemini. 키가 없으면 조립이 compose(로컬) 모델로 대신한다
  differentiate: {provider: gemini, max_tokens: 2000}
  # 차별화 과제 추천(ADR 0012) = 검토와 같은 Gemini. 키가 없으면 조립이 compose(로컬) 모델로 대신한다
  recommend: {provider: gemini, max_tokens: 3000}
  clarify:   {max_tokens: 400}                        # Q1 입력 보강 질문 = 로컬 모델
  outline:   {max_tokens: 1500}                       # Q2 섹션 설계도 = 로컬 모델
  # 이미지 판독(P3, config/vision.yaml) = Gemini 이미지 입력. 키 없으면 OCR 만 (rra vision read)
  vision: {provider: gemini, max_tokens: 3000}
  # U5 선행연구 브리핑 = 검토와 같은 Gemini. 키가 없으면 조립이 compose(로컬) 모델로 대신한다
  brief: {provider: gemini, max_tokens: 2500}
  # [G] 그림 명세(JSON) 작성 = 로컬 모델. 교정 재요청 1회 뒤에도 실패하면 compose.fallback 과 같은 provider 가 대신 쓴다
  figures: {max_tokens: 1500}

# [3] 초안 작성 순서 (ADR 0032, 2026-10-28 소유자 승인). 키가 없으면 local(예전 흐름)
compose:
  # gemini: 섹션을 Gemini 4 Argon 이 먼저 쓴다(provider 표 gemini, 일일 예산 카운터 공유). 호출 실패(error·
  #   rate_limit·budget)나 교정 재요청 뒤에도 무효(invalid)인 섹션만 로컬 모델이 쓴다 — 화면 "로컬 작성" 배지.
  #   키가 없으면 자동으로 local. 전송 범위: 직원 run 은 external_llm.include_internal, 공용 계정 run 은 internal 제외.
  # local: 로컬 모델이 먼저 쓰고 실패 섹션만 stages.compose.fallback 이 쓴다(ADR 0027, 되돌리기용)
  writer: gemini
  concurrency: 4             # Argon 작성일 때 한 run 안에서 동시에 쓰는 섹션 수
  # L2 로컬 2차 검토(ADR 0040) — Argon 이 쓴 문장 중 근거 있는 것을 로컬 모델이 지지|부분|불일치 로만 판정.
  # 시간 상한 없음(시간 때문에 건너뛰는 섹션 없음). 수치·고유명 문장과 2-가-(1)·(2) 먼저. 불일치 문장만 Argon 이
  # "근거 안에서 다시 쓰기 또는 빼기" 제안 → 제안자가 [반영](새 버전)·[무시](결정 기록) — 자동 반영 없음.
  local_check: on

# 검토(review) 단계 정책
review:
  auto: true                 # 초안 완료 뒤 1차 검토 자동 시작
  # ③ Argon 1차 검토(v1→v2). Argon 이 초안을 쓰면(compose.writer: gemini) 자기 검토라 끈다 — draft_review_skipped
  # = self_review. ⑤ 최종 검토는 Argon 그대로이고 그 뒤 마무리한다
  first_pass: off
# 차별화 과제 추천 정책
recommend:
  auto: true                 # precheck 가 끝나면 자동 1회. 다시 받기는 사용자 요청 시만
  # 자기 중복 검사(추천 글로 precheck 재실행) 결과: warn = 카드에 "겹칠 수 있음" 경고(사람이 판단), exclude = 추천에서 제외.
  # e5 만으로는 같은 분야 글이 전부 0.80 위로 차단되어 exclude 면 추천이 항상 0 (2026-10-27 실측) → reranker 뒤 재검토
  self_overlap: warn
external_llm:
  include_internal: true     # 사내(internal) 근거·문장을 외부 검토 LLM 에 보낼지. false 면 "검토 제외"

# Q8 cross-encoder reranker (pipeline.reranker 가 켜져 있을 때만 로드). 모델은 ~/models/ 에 두고 저장소에 넣지 않는다.
# BAAI/bge-reranker-v2-m3: Apache-2.0 라이선스(HF 모델 카드 2026-10-27 확인, 업무 이용 허용). 하이브리드 상위 k×4 를 다시 순위 매긴다.
reranker:
  model: ~/models/bge-reranker-v2-m3
  max_length: 512
  device: mps
embedding:
  model: intfloat/multilingual-e5-base
  device: mps
