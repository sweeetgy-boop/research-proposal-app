# provider·base_url 은 환경변수(RRA_LLM_PROVIDER, RRA_LLM_BASE_URL)가 있으면 그쪽이 이깁니다
# (기본 provider 에만 적용). api_key 는 여기 두지 않습니다. settings.py(.env)에서만 옵니다 (보안 D):
#   mlx → 키 없음, openai → RRA_LLM_API_KEY, gemini → RRA_GEMINI_API_KEY.
provider: mlx            # 기본 provider (stages 에서 provider 를 안 적은 단계가 쓴다)

# provider 별 접속 정보. 원격 provider 는 base_url 호스트가 security.yaml allowed_domains 에 있어야 기동한다 (보안 C).
# H: provider=mlx 면 base_url 이 127.0.0.1/localhost 가 아닐 때 기동을 거부합니다.
providers:
  mlx:
    base_url: http://127.0.0.1:8080/v1
    # manifest 에 기록할 실제 모델 이름 (표시용 선언). 요청에는 항상 stages 의 model 을 보낸다.
    # `mlx_lm.server --model` 에 준 값과 똑같이 적는다. rra llm-check 가 /v1/models 에 있는지 확인(경고만).
    served_model: mlx-community/Qwen2.5-7B-Instruct-4bit
    # mlx_lm.server 는 요청의 model 이 "default_model" 이면 기동 시 --model 로 띄운 모델을 쓴다.
    model: default_model
    # mlx_lm.server 는 response_format 을 오류 없이 무시하므로 auto 로는 폴백이 일어나지 않는다 → prompt.
    json_mode: prompt
  gemini:                # Gemini 4 Argon — OpenAI 호환 엔드포인트 (검토 단계)
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    model: gemini-4-argon
    served_model: gemini-4-argon
    # auto: response_format(json_object) 먼저, 거부(오류)하면 프롬프트 폴백. 실응답 확인 전 기본값.
    json_mode: auto
    # 추론 노력 low|medium|high (none 금지). thinking_level 과 동시 전송 금지 — 어댑터가 거부한다.
    reasoning_effort: low
  openai:
    base_url: https://api.openai.com/v1
    model: gpt-4o-mini
    json_mode: auto

# 공통 (provider 표에 없는 값의 기본)
json_mode: auto
temperature: 0.2

timeout:                 # 초
  connect: 5
  read: 180
  write: 10
  pool: 5

retries:                 # 429·5xx·타임아웃만 재시도. 401/403 은 재시도 없이 사용자 메시지.
  attempts: 3
  backoff_sec: 0.5
  max_backoff_sec: 8

limits:                  # DoS·메모리 보호 상한
  max_tokens_cap: 8192
  prompt_max_chars: 120000

# 단계별 설정. provider 를 적지 않으면 기본 provider. model 을 적지 않으면 provider 표의 model.
stages:
  expand:    {max_tokens: 512}
  summarize: {max_tokens: 400}
  compose:   {max_tokens: 2000}                       # 작성 = mlx(Qwen2.5-7B)
  critique:  {max_tokens: 800}
  review:    {provider: gemini, max_tokens: 6000}     # 검토 = gemini-4-argon (키 없으면 review_skipped)

# 검토(review) 단계 정책
review:
  auto: true                 # 초안 완료 뒤 1차 검토 자동 시작
external_llm:
  include_internal: true     # 사내(internal) 근거·문장을 외부 검토 LLM 에 보낼지. false 면 "검토 제외"

embedding:
  model: intfloat/multilingual-e5-base
  device: mps
