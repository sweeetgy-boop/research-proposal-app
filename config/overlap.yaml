# 유사과제 판정(5. 특이사항·precheck)의 키워드 조건.
# 임계치(own 0.80 · domestic_rail 0.85 · external 0.90)는 domain/rules/overlap.DEFAULT_THRESHOLDS 에 있고
# 여기서 바꾸지 않는다 — own 문서 표본이 쌓여 참·거짓 양성 분포를 본 뒤 조정한다.
#
# 차단 = 유사도가 티어 임계치 이상 AND 질의 키워드(일반어 제외)가 문서에 min_hits 개 이상 등장.
# 유사도만 넘고 키워드가 없으면 경보 목록에는 남지만 차단하지 않는다.
#
# 생성 근거 검색의 관련도 하한 (이슈 #2, domain/rules/relevance.py). 검색 청크가 근거로 남으려면
#   유사도 ≥ min_similarity, 그리고 한글 청크면 질의 키워드(아래 generic_terms 제외) ≥ min_keyword_hits.
# 영어 논문 청크는 한국어 질의와 토큰이 겹칠 수 없어 키워드 조건을 보지 않는다.
# 2026-10-26 골든셋 측정(tests/fixtures/relevance_golden.json): 01 궤도의 관련 논문 최저 0.793,
# 03 도서관(무관)의 최고 0.783, 무관 한글 요약 0.78~0.81(키워드 0건). 표본이 쌓이면 조정한다.
evidence_floor:
  min_similarity: 0.79
  min_keyword_hits: 1
keywords:
  min_hits: 2
  # 철도 과제 문서에 흔해 겹쳐도 근거가 안 되는 말. domain/rules/keywords.DEFAULT_GENERIC_TERMS 에 더해진다.
  # 조사를 뗀 어간으로 적는다 (예: "안전성" 이 아니라 "안전").
  generic_terms:
    - 안전
    - 효율
    - 비용
    - 절감
    - 데이터
    - 정보
    - 측정
    - 평가
    - 제도
    - 지원
    - 열차
    - 노선
    - 구간
    - 현장
    - 국내
    - 해외
    - 사례
    - 수행
    - 도입
    - 지속
