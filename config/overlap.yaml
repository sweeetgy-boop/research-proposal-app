# reranker 점수 중심 판정 (2026-10-28 레인 A, domain/rules/overlap.RerankRule). e5 유사도는 철도 문서끼리 0.85~0.86 에
# 몰려 가르지 못한다 — reranker(bge-reranker-v2-m3, 0~1) 점수가 있으면 threshold 이상 AND 핵심 키워드 min_hits 이상이어야
# 규칙 차단. e5 는 후보 검색(풀)에만. 값은 골든셋 측정(docs/eval-2026-10-28-precheck-v2.md)으로 정했다.
rerank:
  threshold: 0.5
# AI 같음 판정 (레인 A): 규칙 판정 상위 max_candidates 건을 Argon(review 단계) 한 번에 "대상·문제·방법이 같은가" →
# same 만 차단. Argon 실패면 로컬 모델(local_stage, 로컬 슬롯 안), 둘 다 실패면 규칙 판정 + 화면 "AI 판정 실패 — 규칙 기준".
judgment:
  enabled: true
  stage: review
  local_stage: clarify
  max_candidates: 10
  # 제한 시간 없음 (2026-10-28 밤 레인 A, ADR 0039): 느린 Argon 은 오류가 아니다 — 화면이 경과 초와 [취소] 를 보인다.
  # 로컬 → 규칙 대체는 오류 응답(예외·예산·해석 실패)일 때만. 옛 timeout_seconds·local_timeout_seconds 는 읽지 않는다.
  # 차별화 과제안 카드 겹침 재판정 (ADR 0039): 카드 글로 위 규칙 판정(reranker ≥ 0.5 + 핵심 키워드) → 걸린 과제(카드마다 3건)를
  # Argon 한 번에 같음 판정. "같다" 카드는 보이기 전에 그 카드만 한 번 다시 받는다. false 면 종전 자기 중복 검사(e5).
  cards: true

# 유사과제 판정·알림 후보 자료원 (2026-10-28, ADR 0028, domain/rules/overlap_candidates.py).
# ScienceON 2,045건·NTIS 연구보고서 1,084건 적재 뒤 논문(유사도 0.88~0.90)이 상위를 메워 사내 기록이 밀렸다
# (골든셋 precheck 적중 9/10 → 6/10). 과제형 자료원만 판정·차단·근접 알림에 쓰고, 논문·보고서·특허는
# `related_research`(관련 연구, 참고) 로 따로 돌려준다. doc_types 가 비면 그 자료원 전부.
# project 가 비면 제한 없음(옛 동작). NTIS 는 과제검색(rnd_project)만 과제, 연구보고서(report)는 관련 연구.
candidates:
  project:
    - {source: own}
    - {source: alio}
    - {source: ntis, doc_types: [rnd_project]}
    - {source: g2b}
  # 후보 풀(reranker 입력): 자료원마다 상위 per_source 건을 먼저 넣고 나머지는 전체 순위로 size 까지.
  # NTIS 과제 2,000건은 요약이 비슷해 e5 유사도 0.87~0.89 로 사내 기록(0.84~0.86)을 상위 80 밖으로 밀어낸다
  # (2026-10-28 골든셋 01·10). 측정(docs/eval-2026-10-28-precheck.md): 7/28 → 적중 9/10·1.94~2.09s, 6/24 → 8/10(10번 놓침)·
  # 지연 같음(reranker 자체가 1.7~2.0s). 그래서 7/28.
  pool:
    per_source: 7
    size: 28
  research:
    k: 5
    members:
      - {source: scienceon}
      - {source: openalex}
      - {source: kipris_kr}
      - {source: kipris_intl}
      - {source: ntis, doc_types: [report]}
