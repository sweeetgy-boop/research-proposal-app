    - 있는
    - 없는
    # 2026-10-28 밤 레인 A (ADR 0039): ② 핵심 키워드 칸에 보인 일반어 — 시범 실시간 검색 Argon 키워드 30건
    # (data/cache/live_search)·시범 run 의 알림 키워드·골든셋에서 여러 분야에 두루 나온 서술어·일반 명사.
    # 분야 고유어(궤도·전차선·베어링·주차장·유휴부지 …)와 붙여 쓴 복합어(수송수요·수요예측·차량기지)는 두지 않는다.
    - 예측
