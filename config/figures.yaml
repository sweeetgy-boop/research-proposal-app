# 제안서 그림(인포그래픽) 설정 [G] (2026-10-28, architecture §4.16). 이미지 생성 AI 는 쓰지 않는다 —
# 초안을 구조화한 "그림 명세(JSON)" 를 템플릿으로 SVG → PNG(300dpi) 로 그린다 (adapters/figures).
enabled: true                 # false 면 생성·검토 전송·HWPX 삽입 전부 생략 (기존 흐름과 같음)
max_default: 4                # 초안 뒤 기본 그림 상한 — v2: As-Is/To-Be 1(+ 수치 그래프·일정표) + 분석 기법 추천 0~2 (domain/rules/figures.py)
dpi: 300
max_png_bytes: 512000         # 그림당 PNG 상한 500KB (HWPX BinData)
width_px: 1600                # SVG 기준 폭(px). 양식 칸 너비에 맞춰 비율 유지 축소
fonts_dir: config/templates/figures/fonts   # Pretendard Regular·Bold 서브셋 (tools/build_figure_fonts.py)
template_dir: config/templates/figures      # 종류별 명세 스키마(*.schema.json)
kinds: [concept, process, schedule, stat_chart, comparison, roadmap, as_is_to_be, technique]
# v2 초안 뒤 자동으로 그리는 종류 (우선순위 순서는 domain/rules/figures.choose_default). 개념도·체계도·로드맵은
# 글자가 작고 본문을 되풀이해 [다른 그림 추가]에서만 (2026-10-28 시범 의견)
auto_kinds: [as_is_to_be, stat_chart, schedule]
# [11] 분석 기법 추천 — 목록(20종)은 config/figures/techniques.yaml. 0 이면 추천을 끈다
max_techniques: 2
techniques: figures/techniques.yaml   # config 폴더 기준
spec_stage: figures           # llm.yaml stages.figures (로컬 모델이 명세 JSON 작성). 교정 재요청 1회 뒤 compose.fallback 규칙
# Nano Banana Pro(그림 생성·말로 고치기) — provider gemini, 모델은 llm.yaml providers.gemini.image_model. 호출은 공용 제한기 경유.
daily_image_cap: 150          # 그림 호출 일일 상한(생성·말로 고치기·다시 만들기 포함). 넘으면 기본 그림 + 화면 알림. 0 = 없음
budget_counter: data/cache/figure_budget.json   # {"date","count"} — API·CLI 가 같은 파일을 본다
cache_dir: data/cache/figures # 같은 명세·같은 밑그림(해시)이면 다시 부르지 않는다
concurrency: 3                # 초안 1건당 그림 동시 생성 수
image_size: 2K                # 1K | 2K | 4K
# v2 [4] 비율은 내용 양으로 고른다(rules.choose_aspect). false 면 아래 종류별 비율 고정
# [23] 모든 그림은 가로로 넓게 (domain/rules/figure_fit.WIDE_ASPECTS): 16:9·21:9, 일정표·로드맵은 21:9·4:1.
#   4:1 은 Nano Banana 가 받지 않아 21:9 로 만들고 흰 여백을 잘라 4:1 로 맞춘다. 표의 좁은 값(4:3 등)은 가로 비율로 올린다
auto_aspect: true
aspect:                       # 종류별 비율 (auto_aspect: false 일 때. Nano Banana imageConfig.aspectRatio, 밑그림도 같은 비율)
  concept: "21:9"
  process: "16:9"
  schedule: "21:9"
  stat_chart: "16:9"
  comparison: "16:9"
  roadmap: "21:9"
  as_is_to_be: "16:9"
  technique: "16:9"
# [23] 본문 폭 맞춤 — 그림 폭 = 양식 본문 안쪽 폭(실물 양식에서 읽음: 쪽 폭 − 좌우 여백 − 단락 오른쪽 여백), 높이는 비율.
# 높이 > 쪽 높이 × height_share 면 더 넓은 비율로, 그림 안 글자 < min_text_pt 면 글자를 줄여 다시 그린다
fit:
  min_text_pt: 9.0            # 본문 폭으로 넣었을 때 그림 안 가장 작은 글자 (캡션·출처 12pt 는 HWPX 단락)
  height_share: 0.3333        # 쪽 높이 대비 그림 높이 상한
  body_width_mm: 153.8        # 양식을 못 읽을 때 (별지 제2호서식 실측: 210 − 25×2 − 6.2)
  page_height_mm: 297.0
  max_shorten: 2              # 밑그림 글자 줄이기 단계 (22자·항목 3 → 16자·항목 2)
  max_image_redraws: 2        # OCR 로 잰 그림 글자가 작을 때 글자 수를 줄여(22 → 16자) Nano Banana 다시 부르기 (그림 호출 +1씩, 2026-10-29 1 → 2)
  ocr: true                   # macOS Vision OCR 로 그림 글자 크기 어림 (없으면 밑그림 값)
  ocr_box_em: 1.2             # OCR 줄 상자 높이 ÷ 글자 크기 — 밑그림으로 잰 값 (docs/eval-2026-10-28-figures-wide.md)
hwpx:
  placement: inline           # inline(섹션 칸 안, 본문 뒤) | appendix(문서 끝 "별첨 그림"). render-check 가 깨지면 appendix 로 자동 전환
  max_width_hwp: 43606        # [23] 양식을 못 읽을 때의 그림 폭 (HWPUNIT = 본문 안쪽 153.8mm). 읽으면 그 값
  caption_prefix: 그림
# 색상 토큰 — 흑백 인쇄에서도 구분되게 명도 차 + 무늬(점·빗금)·선 모양을 함께 쓴다. 로고·상표·사진 금지.
palette:
  ink: "#1a1a1a"            # 글자·외곽선
  muted: "#5b5b5b"          # 보조 글자·캡션
  line: "#8c8c8c"           # 격자·연결선
  paper: "#ffffff"
  series:                   # 순서대로 명도가 어두워진다 (L* 85 → 30). 무늬·선 모양과 짝: solid, dots, hatch, dashed
    - { fill: "#dbe7f3", stroke: "#1f4e79", pattern: solid,  dash: "" }
    - { fill: "#9fc0dc", stroke: "#1f4e79", pattern: dots,   dash: "6 3" }
    - { fill: "#5f8fb8", stroke: "#123a5c", pattern: hatch,  dash: "2 2" }
    - { fill: "#2b5f8e", stroke: "#0b2d4d", pattern: cross,  dash: "8 3 2 3" }
  accent: "#b45309"         # 강조(제안 과제 열·현재 단계) — 명도 낮음
  warn: "#9a3412"
