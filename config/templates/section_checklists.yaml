# Q5 섹션별 필수 요소 체크리스트 — 1차·최종 검토 프롬프트에 넣어 빠진 요소를 찾고(additions 제안), 충족률을 센다.
# 키는 proposal_korail.rules.yaml sections 와 같아야 한다. 항목은 심사자가 보는 요소.
tech_importance:
  - 기존 기술·선행연구의 한계
  - 본 과제의 기술적 차별점
  - 국내외 동향 근거(논문·과제 인용)
objective:
  - 달성할 목표의 구체적 서술
  - 목표 수준 또는 범위(대상 노선·설비·지표)
method:
  - 단계(연차 또는 준비-개발-검증)
  - 데이터(수집 대상·출처)
  - 검증 방법
  - 일정·산출물
expected_management:
  - 정량 효과(비용·시간·건수 등 근거 있는 값)
  - 정성 효과
  - 수혜 부서·대상
expected_technology:
  - 확보 기술·표준·특허 등 기술적 성과
  - 기존 기술 대비 향상 지점
expected_standing:
  - 대외 위상(학술·산업·정책) 효과
utilization:
  - 활용 주체 부서와 시점
  - 실용화 계획
