# 별지 제2호서식(2024.02.19.) → HWPX 자리표시자. 실물 양식(data/templates/proposal_form_original.hwpx)
# 을 분석해 2026-10-26 확정. 템플릿 파일은 tools/build_form_template.py 가 이 이름으로 만든다.
# 치환 규칙: sanitize → XML escape → (여러 문장 섹션은 단락 생성) → defusedxml 재파싱 검증 (보안 F).

# 섹션 문장 → 칸. title 은 "가. 연구과제명 : " 뒤 한 줄 인라인, 나머지는 제목 아래 본문 단락.
text:
  title: "{{title}}"
  policy_importance: "{{policy_importance}}"
  tech_importance: "{{tech_importance}}"
  strategy_alignment: "{{strategy_alignment}}"
  objective: "{{objective}}"
  method: "{{method}}"
  expected_management: "{{expected_management}}"
  expected_technology: "{{expected_technology}}"
  expected_standing: "{{expected_standing}}"
  utilization: "{{utilization}}"
  overlap_review: "{{overlap_review}}"   # 뒤에 request.remarks 를 이어 붙인다

# 여러 문장 섹션 — 자리표시자가 있는 단락의 서식(paraPr·charPr)을 복제해 문장마다 "○ " 단락 하나씩.
# 여기 없는 text 슬롯(title)은 인라인 치환만 한다.
paragraphs:
  - policy_importance
  - tech_importance
  - strategy_alignment
  - objective
  - method
  - expected_management
  - expected_technology
  - expected_standing
  - utilization
  - overlap_review
paragraph_bullet: "○ "

# 체크 칸 — 사용자가 확정한 값(confirmed.json)으로만 채운다. 확정 전이면 렌더를 거부한다.
# 양식의 "(   )" 괄호는 그대로 두고 괄호 안에 자리표시자가 들어간다 → ( ○ ) / (   ).
marks:
  checked: "○"
  unchecked: " "
choice:
  task_type:
    basic: "{{task_type:basic}}"
    applied: "{{task_type:applied}}"
    development: "{{task_type:development}}"
  utilization:
    strategy_plan: "{{utilization:strategy_plan}}"
    regulation: "{{utilization:regulation}}"
    feasibility: "{{utilization:feasibility}}"
    negotiation: "{{utilization:negotiation}}"
    facility_method: "{{utilization:facility_method}}"
    rolling_stock: "{{utilization:rolling_stock}}"
    software: "{{utilization:software}}"
    manual: "{{utilization:manual}}"
    other: "{{utilization:other}}"
    commercialization: "{{utilization:commercialization}}"
  strategy_alignment:          # 확정한 전략과제 id → korail_strategy.yaml 의 이름 (한 줄 인라인)
    direction: "{{strategy_alignment:direction}}"
    task: "{{strategy_alignment:task}}"

# 사용자 입력 (request.json) — LLM 이 만들지 않는다. 금액은 천원 단위 입력을 천 단위 쉼표로.
input:
  budget.account: "{{budget.account}}"
  budget.amount_thousand_krw: "{{budget.amount}}"
  department: "{{department}}"

# 렌더할 때만 받는 개인정보 (ProposerInfo). run 폴더·manifest 에 저장하지 않는다. 없으면 빈칸.
# proposed_on 만 예외: 비면 렌더 시점의 날짜를 "2026. 10. 26." 형식으로 넣는다.
render_only:
  proposed_on: "{{proposed_on}}"
  proposer.rank: "{{proposer.rank}}"
  proposer.name: "{{proposer.name}}"
  proposer.phone: "{{proposer.phone}}"
  head.rank: "{{head.rank}}"
  head.name: "{{head.name}}"
  head.phone: "{{head.phone}}"

# 한 줄 칸의 글자 수 상한(한글 기준 어림). 넘어도 자르지 않고 렌더 전 알림 목록에 올린다
# (application/usecases/render_check.py). 본문 단락은 페이지가 늘어나므로 rules.yaml max_chars 만 본다.
line_limits:
  title: 30                        # "가. 연구과제명 : " 뒤 12pt, 한 줄 약 36자
  budget.account: 12
  budget.amount_thousand_krw: 12
  strategy_alignment:direction: 30
  strategy_alignment:task: 30
  department: 24                   # 표 셀 폭 31258 HWPUNIT, 10pt
  proposer.rank: 10                # 표 셀 폭 15629 HWPUNIT, 14pt 굵게
  proposer.name: 8                 # 뒤에 "(인)"
  proposer.phone: 14               # 앞에 "☏ "
  head.rank: 10
  head.name: 8
  head.phone: 14
