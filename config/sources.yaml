# 대상 기관 (alio·ntis 공용). 이름·별칭이 수행기관명 안에 들어 있으면 그 태그를 붙인다.
# 기관 개칭: 한국철도시설공단 → 국가철도공단 (2020). 서로 포함 관계인 이름은 넣지 않는다.
institutions:
  - {code: C0268, name: 한국철도공사, tag: korail, aliases: [코레일]}
  - {code: C0269, name: 한국철도기술연구원, tag: krri}
  - {code: C0270, name: 국가철도공단, tag: kr, aliases: [한국철도시설공단]}
# own 티어(중복 임계치 0.80) 기준: org 태그 문서 중 부서가 아래 목록에 있는 것 (철도연구원 소속).
# 부서명 전체 또는 공백·괄호·/ 로 나눈 토큰이 목록과 정확히 같아야 한다 (부분 문자열 매칭 없음).
# org 문서인데 목록에 없는 부서가 나오면 ingest 가 경고한다 → 철도연구원 소속이면 여기에 추가.
own_unit:
  org: korail
  departments:
    - 철도연구원      # 부서 칸에 연구원 이름 자체가 오는 경우 (NTIS 수행부서 등). "철도연구원 ○○처" 도 토큰으로 잡힌다
    - 경영연구처
    - 기술연구처
    - 연구계획처      # 사내 과제 현황 엑셀(제안 현황·2021~2026 수행현황)의 부서 칸
    - 차량기술센터    # 2006~2024 과제목록 자체연구 시트의 과거 부서명
# 사내 자료 (P2). 과제 현황 엑셀은 처리 뒤에도 옮기지 않는다(갱신 파일을 다시 넣으면 덮어쓴다).
# 공시완료 폴더는 연도 폴더(2024/…) 또는 과제 폴더를 그대로 복사한다. 처리된 과제 폴더는 _done/ 으로.
own:
  projects_inbox: data/inbox/own        # 연구과제 제안 현황·연구과제 현황·2006~2024 과제목록·수행현황 (xls·xlsx)
  docs_inbox: data/inbox/own_docs       # 공시완료/<연도>/<과제 폴더>/…요약문(공시용).hwp|hwpx|pdf
  default_org: korail                   # 요약문 본문에 기관명이 없을 때 붙일 기관 태그
alio:
  inbox_dir: data/inbox/alio   # 수동 다운로드 파일 투입 위치 (_done/·_quarantine/ 자동 생성)
  catalog_dir: data/catalog    # 공공데이터포털 CSV. 가장 최근 파일을 쓴다
  summary:
    # 원문 비공개(정보공개법 제9조①7호) 보고서: 알리오 상세 페이지 텍스트를 복사해
    # <catalog_id>.txt 로 저장한다. 원문 filedrop 과 같은 doc_id 를 쓰므로 원문이 나오면 대체된다.
    inbox_dir: data/inbox/alio_summary
    max_file_kb: 256
    # 카탈로그 매칭·기관명 라벨이 없을 때 붙일 기관 태그 (요약 inbox 는 코레일 보고서용)
    default_org: korail
    # 필드 → 후보 라벨. 비워두면 어댑터 기본값(summary.DEFAULT_LABELS). 실제 복사본 확인 후 확정.
    # 필드: title institution published authors project_type pi department period budget
    #       purpose content effect usage disclosure_status disclosure_reason open_date
    labels: {}
  catalog:
    # `rra alio catalog --fetch` 가 받을 fileData 다운로드 URL. 갱신마다 바뀌므로 비워두고
    # 필요할 때 채운다. 호스트는 security.yaml allowed_domains 에 있어야 한다 (www.data.go.kr).
    fetch_url: ""
    max_response_mb: 50
    # 필드 → 후보 헤더명 목록. 비워두면 어댑터 기본값(DEFAULT_COLUMNS). 실제 CSV 확인 후 확정.
    columns: {}
openalex:
  ip_restricted: false      # 키 없음·IP 제한 없음
  rate_limit: 10            # 초당 요청 수
  concurrency: 4
  base_url: https://api.openalex.org   # 호스트는 security.yaml allowed_domains 에 있어야 함
  per_page: 100             # 최대 200
  default_query: railway    # queries 가 비어 있을 때의 질의 (증분)
  lookback_days: 7          # 증분 수집 기간 (publication_date 기준). 야간 적재(com.rra.ingest.plist)가 쓴다
  # 철도 분야 질의 목록 (2026-10-26, 영문). rra ingest --source openalex 는 이 목록을 돌며 질의마다 per_query_limit 까지
  # 관련도순으로 받는다. 조건: 초록 있는 것만(has_abstract), 증분은 lookback_days, 전체(--full)는 backfill_years.
  # 2026-10-28 기준 10년·초록 조건 예상 건수(질의당): 궤도 1,530 / 궤도검측 4,029 / 차량 1,809 / 신호 156 / 전력 585 /
  # 유지보수 16,114 / 안전 1,519 / 수송수요 2,409 / 역사 5,011 / 자산관리 16,017 / 탄소중립 4,596 / 화물 6,580 / 운영 4,098
  # → 상한 200 × 13 = 2,600 (중복 제거 전). 같은 work 는 한 번만, 분야는 raw.field 에 남긴다.
  backfill_years: 10        # --full 수집 기간 (최근 10년 우선)
  per_query_limit: 200      # 질의당 최대 건수
  require_abstract: true    # 초록이 있는 것만
  queries:
    - {field: 궤도,     query: "railway track geometry irregularity degradation"}
    - {field: 궤도검측, query: "rail track inspection defect detection measurement"}
    - {field: 차량,     query: "railway vehicle bogie wheel rail dynamics wear"}
    - {field: 신호,     query: "railway signalling train control interlocking CBTC ETCS"}
    - {field: 전력,     query: "railway electrification catenary pantograph traction power supply"}
    - {field: 유지보수, query: "railway infrastructure maintenance condition monitoring predictive"}
    - {field: 안전,     query: "railway safety risk assessment accident derailment"}
    - {field: 수송수요, query: "rail passenger demand forecasting ridership"}
    - {field: 역사,     query: "railway station passenger flow design facility"}
    - {field: 자산관리, query: "railway asset management life cycle cost infrastructure"}
    - {field: 탄소중립, query: "railway energy efficiency carbon emissions decarbonization"}
    - {field: 화물,     query: "rail freight transport logistics intermodal"}
    - {field: 운영,     query: "train timetable scheduling railway operation capacity"}
  max_response_mb: 20
  max_redirects: 3
  retries: 3
  timeout: {connect: 10, read: 30}
  # polite pool 이메일은 .env RRA_OPENALEX_MAILTO (환경변수가 있으면 그쪽이 이긴다). 여기 mailto 를 적어도 된다.
# 자료원 IP 확인 (레인 I, 2026-10-27). `rra sources check` 가 현재 공인 IP 를 lookup_url 로 한 번 조회해
# 자료원별 registered_ips(활용신청에 등록한 서버 IP) 와 대조한다. 조회 실패는 진단만 남기고 계속.
# API 가 IP 거부("접근 허용 IP가 아닙니다")를 돌려주면 그 자료원만 건너뛰고(ingest --skip-unavailable·
# 사전 점검 NTIS 성과) 안내를 availability_file 에 적어 웹 자료원 상태·`rra sources status` 가 보인다.
public_ip:
  lookup_url: https://api.ipify.org   # 응답은 IP 문자열만. 호스트는 security.yaml allowed_domains 에. 비우면 확인 생략
  timeout: {connect: 5, read: 10}
  availability_file: data/cache/source_availability.json
# 키는 여기 두지 않는다. .env 의 RRA_SCIENCEON_* · RRA_NTIS_KEY 에서만 온다 (보안 D).
scienceon:
  base_url: https://apigateway.kisti.re.kr   # 호스트는 security.yaml allowed_domains 에 있어야 함
  ip_restricted: false      # ScienceON API Gateway 는 호출 IP 제한 없음 (클라이언트 ID·MAC·키로 인증)
  targets: [ARTI, REPORT, PATENT]   # ARTI 국내논문 · REPORT 국내연구보고서 · PATENT 특허(한국, 발명자 항목 없음)
  search_field: BI          # 전체 필드 (2026-10-27 실응답 확인). 공백 = 같은 필드 안 AND, | = OR, ! = NOT
  # 철도 분야 질의 13개 (openalex.queries 분야와 같은 순서, 한국어). 2026-10-27 총건수(ARTI/REPORT/PATENT):
  #   철도 궤도 틀림 1,858/370/911 · 궤도 검측 119/47/44 · 철도차량 차륜 325/115/412 · 철도 신호 열차제어 207/78/148 ·
  #   전차선 643/195/1,173 · 철도 유지보수 1,054/471/628 · 철도 안전 사고 883/271/386 · 철도 수요 예측 273/181/2 ·
  #   철도역 승객 18/6/9 · 철도 자산관리 67/22/3 · 철도 에너지 탄소 54/92/9 · 철도 화물 물류 271/88/17 · 열차 운행계획 268/182/21
  # 질의당 per_query_limit 까지만(정확도순) → 한 (질의, target) 에 1페이지 = 요청 39회 + 토큰 1회.
  #   예상 적재(중복 제거 전): ARTI ≈ 940 · REPORT ≈ 870 · PATENT ≈ 590, 합 ≈ 2,400. 같은 CN 은 한 번만.
  queries:
    - 철도 궤도 틀림         # 궤도
    - 궤도 검측              # 궤도검측
    - 철도차량 차륜          # 차량
    - 철도 신호 열차제어     # 신호
    - 전차선                 # 전력
    - 철도 유지보수          # 유지보수
    - 철도 안전 사고         # 안전
    - 철도 수요 예측         # 수송수요
    - 철도역 승객            # 역사
    - 철도 자산관리          # 자산관리
    - 철도 에너지 탄소       # 탄소중립
    - 철도 화물 물류         # 화물
    - 열차 운행계획          # 운영
  row_count: 100            # 가이드 최대 100
  per_query_limit: 80       # (질의, target) 당 최대 건수. 1,000~2,000 건으로 줄이려면 50 또는 PATENT 제외
  # 레이트리밋 — 과거 429 이력이 있어 보수적으로
  rate_limit: 1             # 초당 요청 수 (토큰 요청 포함)
  max_requests_per_run: 48  # ingest 1회당 요청 예산(토큰 1 + 13×3 페이지 = 40, 재시도 여유 8). 다 쓰면 모은 만큼만 적재
  max_consecutive_429: 2    # 재시도까지 소진한 429 가 연속 N회면 이 run 에서 중단
  retries: 3
  max_backoff_sec: 30       # Retry-After 가 이보다 길면 재시도하지 않고 중단
  max_response_mb: 20
  timeout: {connect: 10, read: 30}
ntis:
  # NTIS 국가R&D OpenAPI (rndopen apprvKey, .env RRA_NTIS_KEY). 승인 서비스 4개(2026-10-27, 유효 2027-05-27): 과제검색·성과검색·
  # 연구보고서 검색·연관콘텐츠 추천. 형식은 공개 매뉴얼(과제검색 2021-02-08, 연구보고서 2021-12-28; tests/fixtures/ntis/README.md).
  # 호출 IP 제한: 활용신청에 등록한 서버 IP 에서만 받는다(다르면 HTTP 200 + "접근 허용 IP가 아닙니다").
  # 등록 IP 목록(2026-10-27). 바뀌면 여기와 활용신청 둘 다 고친다 — `rra sources check --source ntis` 가 대조한다.
  base_url: https://www.ntis.go.kr
  ip_restricted: true
  registered_ips: ["59.0.166.199", "59.0.251.250"]
  project_path: /rndopen/openApi/public_project     # 과제검색 (매뉴얼 p.6). SRWR·searchFd·startPosition·displayCnt
  report_path: /rndopen/openApi/rresearchpdf/       # 연구보고서 검색 (매뉴얼 p.6). query·searchField·displayCount·returnType
  outcome_path: /rndopen/openApi/public_result      # 성과검색 (공개 구현 기준 — 실호출로 확정). collection rpaper|rpatent
  related_path: /rndopen/openApi/ConnectionContent  # 연관콘텐츠 추천 (공개 구현 기준, JSON). pjtId
  record_tag: HIT           # 매뉴얼 응답명세: RESULT > RESULTSET > HIT (NO 속성). 총건수 TOTALHITS
  search_field: BI          # 전체(과제명·기관·키워드·연구목표·내용·기대효과)
  # 철도 분야 질의 13개 (openalex.queries 분야와 같은 순서, 한국어). 과제검색은 띄어쓰기 = AND 라 2어절 이내로 짧게.
  # 총건수는 IP 등록 뒤 `rra sources check` / 녹화 도구로 채운다. 예상(질의당 상한 per_query_limit 150 × 13 = 1,950, 중복 제거 전).
  queries:
    - 철도 궤도              # 궤도
    - 궤도 검측              # 궤도검측
    - 철도차량               # 차량
    - 철도 신호              # 신호
    - 전차선                 # 전력
    - 철도 유지보수          # 유지보수
    - 철도 안전              # 안전
    - 철도 수요              # 수송수요
    - 철도역                 # 역사
    - 철도 자산관리          # 자산관리
    - 철도 탄소              # 탄소중립
    - 철도 화물              # 화물
    - 열차 운행              # 운영
  report_queries: []        # 비어 있으면 queries 와 같다 (rra ingest --source ntis_reports)
  display_count: 100        # 페이지 크기 (매뉴얼 예 100)
  per_query_limit: 150      # 질의당 최대 건수 → 질의당 2페이지, 13 질의 = 요청 26회
  rate_limit: 2             # 초당 2회 (매뉴얼 30 tps 상한보다 훨씬 낮게)
  max_requests_per_run: 60
  retries: 3
  max_backoff_sec: 30
  max_response_mb: 20
  timeout: {connect: 10, read: 30}
  insights:                 # ② 성과검색·연관콘텐츠 (REST POST /v1/precheck/ntis-outcomes)
    enabled: true
    max_projects: 3         # 알림 상위 NTIS 과제 몇 건까지
    max_items: 10           # 과제당 성과·추천 최대
    cache_dir: data/cache/ntis   # 과제번호 기준 파일 캐시 (JSON, 비밀 없음)
    cache_ttl_days: 7
# KIPRIS Plus 특허·실용신안 자유검색 (P4). 키는 .env RRA_KIPRIS_KEY 에만 (plus.kipris.or.kr 활용신청 → accessKey).
# 공공데이터포털(data.go.kr) 경로는 같은 데이터·키 체계이고 월 상한 뒤 KIPRIS Plus 로 안내하므로 KIPRIS Plus 를 기본으로 한다.
# 경로·파라미터·레코드 태그는 공개 구현 기준이며 첫 실응답(rra sources check --source kipris, 녹화 도구)으로 확정한다.
kipris:
  base_url: https://plus.kipris.or.kr              # 호스트는 security.yaml allowed_domains 에 있어야 함
  ip_restricted: false                             # KIPRIS Plus 는 accessKey 만 — IP 제한 확인된 바 없음
  search_path: /openapi/rest/patUtiModInfoSearchSevice/freeSearchInfo
  key_param: accessKey                             # 키 파라미터 이름 (data.go.kr 경로를 쓰면 ServiceKey)
  record_tag: PatentUtilityInfo                    # 레코드 요소 이름 — probe 의 record_tag_candidates 로 확인
  queries: [철도 궤도, 철도 차량, 전차선, 철도 신호, 철도 역사]
  docs_count: 50                                   # 페이지당 건수 (최대 100)
  include_utility: true                            # 실용신안 포함
  rate_limit: 3
  max_requests_per_run: 60
  retries: 3
  max_backoff_sec: 30
  max_response_mb: 20
  timeout: {connect: 10, read: 30}
