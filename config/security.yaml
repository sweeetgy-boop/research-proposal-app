# C. 아웃바운드 허용목록 — 여기 없는 도메인은 어댑터가 접속 거부
allowed_domains:
  - api.openalex.org
  - apis.data.go.kr
  - plus.kipris.or.kr
  - www.ntis.go.kr
  - www.data.go.kr

# B. 파일 상한
file_limits:
  max_file_mb: 200
  max_zip_ratio: 100
  max_pdf_pages: 600
  parse_timeout_sec: 120
  parse_mem_mb: 2048
  max_output_mb: 32         # 파서 자식 프로세스 stdout 상한
  max_zip_entries: 2000     # HWPX 엔트리 수 상한

# G. 입력 상한
input_limits:
  slot_max_chars: 2000
  query_max_chars: 500
  concurrent_generations: 1
  max_queued_runs: 3         # 사용자별 대기·실행 중 run 상한 (MCP 무한 제출 방지)

# I. 보존
retention_days: 180
