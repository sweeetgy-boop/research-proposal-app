# C. 아웃바운드 허용목록 — 여기 없는 도메인은 어댑터가 접속 거부
allowed_domains:
  - api.openalex.org
  - apigateway.kisti.re.kr   # ScienceON API Gateway (Step 7)
  - apis.data.go.kr
  - plus.kipris.or.kr
  - www.ntis.go.kr
  - www.data.go.kr
  - generativelanguage.googleapis.com   # Gemini OpenAI 호환 엔드포인트 (검토 LLM)
  - info.korail.com   # 공사 홈페이지(회사소개) 스냅샷 수집 — rra crawl korail (레인 A)
  - www.molit.go.kr   # 국토교통부 정책자료(철도 계획) — rra ingest --source molit (P2-1)
  - www.kaia.re.kr    # 국토교통과학기술진흥원 사업공고 — rra crawl rnd-notice (P2-7)
  - www.iris.go.kr    # 범부처 통합연구지원시스템 사업공고(국토교통부 필터) — rra crawl rnd-notice (P2-7)
  - www.bai.go.kr     # 감사원 감사결과 전문 — rra crawl bai (P2-4, Playwright 화면 조작만)
  - mofe.go.kr        # 기획재정부 보도자료(공공기관 경영평가 결과) — rra ingest --source mofe (P2-5)
  # www.data.go.kr(파일데이터, 키 없음 — rra ingest --source datago, P2-2·3)·apis.data.go.kr(나라장터 g2b)은 위에 있음

# B. 파일 상한
file_limits:
  max_file_mb: 200
  max_zip_ratio: 100
  max_pdf_pages: 600
  parse_timeout_sec: 120
  parse_mem_mb: 2048
  max_output_mb: 32         # 파서 자식 프로세스 stdout 상한
  max_zip_entries: 2000     # HWPX 엔트리 수 상한

# G. 입력 상한
input_limits:
  slot_max_chars: 2000
  query_max_chars: 500
  concurrent_generations: 1
  max_queued_runs: 3         # 사용자별 대기·실행 중 run 상한 (MCP 무한 제출 방지)

# I. 보존
retention_days: 180
