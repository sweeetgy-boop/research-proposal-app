# 근거 구성 규칙 — 자료원이 늘어도(policy·korail_news·statistics·audit·procurement·rnd_notice·ScienceON) 논문·보고서·특허가
# 밀리지 않게 한 곳에서 정한다 (2026-10-27, 통합 [0]). 설계: docs/architecture.md §4.16.
# - min_per_source: 전체 검색에서 출처(doc_id 접두어 = source)마다 최소 보장 건수. overlap.yaml evidence_floor 의 값보다 우선.
# - section_min_per_source: 섹션별 검색(Q3)에서의 출처별 최소 보장.
# - scholarly: "논문·보고서·특허" 로 묶는 doc_type. 섹션의 min_scholarly 가 이 묶음에서 최소 몇 건을 남길지.
# - sections.<키>.allow: 그 섹션 프롬프트 [자료] 에 넣을 doc_type. 비어 있거나 섹션이 없으면 전부. 걸러서 0건이면 전부로 되돌린다.
#   doc_type 을 모르는 청크(옛 스냅샷)는 거르지 않는다.
# - overlap_exclude: 유사과제 판정(precheck·generate)에서 뺄 doc_type — 정책·보도·통계·감사·공고는 과제가 아니다.
#   발주 용역(procurement)은 판정에 "용역" 구분으로 들어간다(제외하지 않음).
# - NTIS(2026-10-27 레인 N, ADR 0020): 과제검색은 doc_type rnd_project(raw.kind national_rnd), 연구보고서는 report(raw.kind
#   national_rnd_report). doc_id 접두어 ntis 라 min_per_source(6) 가 그대로 최소 보장이 된다(요청 최소 2 이상). report 는 scholarly 에
#   이미 들어 있어 ScienceON 보고서와 같은 "보고서" 범주로 센다. 유사과제 판정에는 티어 national_rnd 로 들어간다(overlap_exclude 아님).
#   국가R&D 과제 요약(연구목표·내용·기대효과)을 필요성·기대효과 본문 근거에서 빼는 규칙은 doc_type 만으로는 own 과제(rnd_project)와
#   구분되지 않아 보류 — raw.kind 별 허용은 후속(적재 뒤 골든셋 01·02 근거 구성으로 판단). 성과·추천은 화면 전용, 검색 집합에 없다.
# - 근거 범위(2026-10-29 레인 D, ADR 0046): 공사 홈페이지 행정 공시(admin_notice)·사업 현황(status_report)·통계(statistics)는
#   정책 자료가 아니다. 필요성·현황 섹션 — 2-가-(2) 기술적 중요도(기존 기술·현황의 한계), 2-나 연구목적(대상·범위 현황) — 에서만
#   근거가 된다. 통계는 지금까지처럼 3-가 경영혁신(기대효과의 현황 기준값)에도 쓴다(datago 통계와 같은 doc_type).
#   only_in: doc_type → 쓸 수 있는 섹션. 0건 되돌리기(전부)에서도 다른 섹션에는 주지 않는다.
#   strict: 참이면 0건이어도 전부로 되돌리지 않는다 — 2-가-(3) 경영전략 정합성은 정책·전략 문서(policy)만.
min_per_source: 6
section_min_per_source: 2
scholarly: [paper, report, patent]
sections:
  tech_importance:     {allow: [paper, report, patent, internal_report, rnd_project, status_report, admin_notice, statistics], min_scholarly: 2}
  objective:           {allow: [paper, report, patent, internal_report, rnd_project, statistics, table_facts, status_report, admin_notice]}
  method:              {allow: [paper, report, patent, internal_report, rnd_project], min_scholarly: 2}
  policy_importance:   {allow: [policy, audit, rnd_notice]}     # 입력 전용 섹션 — 자료는 주지 않지만 규칙은 명시
  strategy_alignment:  {allow: [policy], strict: true}   # 정책·전략 문서만 — 되돌리기 없음
  expected_management: {allow: [internal_report, rnd_project, statistics, table_facts, paper, report, audit]}
  expected_technology: {allow: [paper, report, patent, internal_report, rnd_project]}
  expected_standing:   {allow: [paper, report, patent, internal_report, rnd_project, policy]}
  utilization:         {allow: [internal_report, rnd_project, paper, report, procurement]}
  overlap_review:      {allow: [internal_report, rnd_project, procurement, paper, report, patent]}
overlap_exclude: [policy, korail_news, audit, statistics, table_facts, rnd_notice, admin_notice, status_report]
only_in:
  admin_notice:  [tech_importance, objective]
  status_report: [tech_importance, objective]
  statistics:    [tech_importance, objective, expected_management]
