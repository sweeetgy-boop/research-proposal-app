# PR 과 main push 마다 backend(uv·pytest·lint-imports·ruff)와 web(npm ci·lint·typecheck·test).
# 비밀 키 없이 돈다 — 키·실물 양식·사내 데이터가 필요한 테스트는 skipif 로 건너뛴다(.env 없음, data/ 없음).
# web/ 가 없으면 web job 은 건너뛴다. main 보호 규칙 "Require status checks" 에는 job 이름 backend·web 을 건다.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.probe.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - id: probe
        run: |
          if [ -f web/package.json ]; then echo "web=true" >> "$GITHUB_OUTPUT"; else echo "web=false" >> "$GITHUB_OUTPUT"; fi

  backend:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"        # 모델을 내려받지 않는다 (테스트는 fake 임베딩·fake LLM)
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Python 3.12 venv + dev extras
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
      - name: pytest
        run: .venv/bin/python -m pytest -q -p no:cacheprovider
      - name: lint-imports
        run: .venv/bin/lint-imports
      - name: ruff
        run: .venv/bin/ruff check src tests

  web:
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm test --if-present -- --run
