[project]
name = "research-proposal-app"
version = "0.1.0"
description = "연구과제 제안서 자동 작성 (KORAIL 철도연구원 양식)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
adapters = ["httpx>=0.27", "defusedxml>=0.7", "sqlite-vec>=0.1", "sentence-transformers>=3.0", "pymupdf>=1.24"]
api = ["fastapi>=0.111", "uvicorn>=0.30"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "import-linter>=2.0", "bandit>=1.7", "pip-audit>=2.7", "pre-commit>=3.7"]

[project.scripts]
rra = "rra.entrypoints.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rra"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
per-file-ignores = { "tests/*" = ["S101"] }

# ── 계층 규칙 (import-linter) ─────────────────────────────
[tool.importlinter]
root_package = "rra"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain is pure"
type = "forbidden"
source_modules = ["rra.domain"]
forbidden_modules = ["rra.application", "rra.adapters", "rra.entrypoints", "rra.composition",
                     "httpx", "sqlite3", "openai", "yaml", "fastapi"]

[[tool.importlinter.contracts]]
name = "application depends only on domain"
type = "forbidden"
source_modules = ["rra.application"]
forbidden_modules = ["rra.adapters", "rra.entrypoints", "rra.composition",
                     "httpx", "sqlite3", "openai", "fastapi"]

[[tool.importlinter.contracts]]
name = "adapters never import usecases or entrypoints"
type = "forbidden"
source_modules = ["rra.adapters"]
forbidden_modules = ["rra.application.usecases", "rra.entrypoints", "rra.composition"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
