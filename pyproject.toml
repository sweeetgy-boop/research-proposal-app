[project]
name = "research-proposal-app"
version = "0.1.0"
description = "연구과제 제안서 자동 작성 (KORAIL 철도연구원 양식)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# 무거운 의존성(torch)을 피하려고 persistence / embedding 을 분리했다.
persistence = ["sqlite-vec>=0.1"]
embedding = ["sentence-transformers>=3.0"]
sources = ["httpx>=0.27", "defusedxml>=0.7", "pymupdf>=1.24"]
llm = ["httpx>=0.27"]
mcp = ["mcp>=2.2"]
adapters = ["research-proposal-app[persistence,embedding,sources,llm]"]
api = ["fastapi>=0.111", "uvicorn>=0.30"]
dev = ["research-proposal-app[persistence,llm,mcp]", "pytest>=8", "pytest-asyncio>=0.23",
       "ruff>=0.5", "import-linter>=2.0", "bandit>=1.7", "pip-audit>=2.7", "pre-commit>=3.7"]

[project.scripts]
rra = "rra.entrypoints.cli:_entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rra"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# src 레이아웃을 명시해야 ruff 버전이 달라도 rra 를 1st-party 로 동일하게 분류한다.
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
per-file-ignores = { "tests/*" = ["S101", "S311"] }

# ── 계층 규칙 (import-linter) ─────────────────────────────
[tool.importlinter]
root_package = "rra"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain is pure"
type = "forbidden"
source_modules = ["rra.domain"]
forbidden_modules = ["rra.application", "rra.adapters", "rra.entrypoints", "rra.composition",
                     "httpx", "sqlite3", "openai", "yaml", "fastapi", "mcp"]

[[tool.importlinter.contracts]]
name = "application depends only on domain"
type = "forbidden"
source_modules = ["rra.application"]
forbidden_modules = ["rra.adapters", "rra.entrypoints", "rra.composition",
                     "httpx", "sqlite3", "openai", "fastapi", "mcp"]

[[tool.importlinter.contracts]]
name = "adapters never import usecases or entrypoints"
type = "forbidden"
source_modules = ["rra.adapters"]
forbidden_modules = ["rra.application.usecases", "rra.entrypoints", "rra.composition"]

# 진입점은 어댑터를 직접 고르지 않는다. 조립은 composition 만 한다.
# (composition 을 거치는 간접 경로는 허용해야 하므로 allow_indirect_imports)
[[tool.importlinter.contracts]]
name = "entrypoints reach adapters only through composition"
type = "forbidden"
source_modules = ["rra.entrypoints"]
forbidden_modules = ["rra.adapters"]
allow_indirect_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
