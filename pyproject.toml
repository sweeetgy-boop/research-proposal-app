[project]
name = "research-proposal-app"
version = "0.1.0"
description = "연구과제 제안서 자동 작성 (KORAIL 철도연구원 양식)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# 무거운 의존성(torch)을 피하려고 persistence / embedding 을 분리했다.
persistence = ["sqlite-vec>=0.1"]
embedding = ["sentence-transformers>=3.0"]
sources = ["httpx>=0.27", "defusedxml>=0.7", "pymupdf>=1.24", "cryptography>=42",
           "olefile>=0.47", "openpyxl>=3.1", "xlrd>=2.0"]  # hwp(OLE)·xlsx·xls 샌드박스 파서
llm = ["httpx>=0.27"]
mcp = ["mcp>=2.2"]
render = ["python-hwpx>=6.8", "defusedxml>=0.7", "resvg-py>=0.5", "pillow>=10"]  # HWPX + 그림 밑그림(SVG→PNG, [G])
adapters = ["research-proposal-app[persistence,embedding,sources,llm]"]
api = ["fastapi>=0.111", "uvicorn>=0.30"]
vision = ["ocrmac>=1.0", "pillow>=10"]  # P3 이미지 판독: macOS Vision OCR(격리 자식)·이미지 상한 검사. macOS 전용
history = ["matplotlib>=3.8"]  # tools/history_charts.py (발표용 그래프) — 검사·운영에는 불필요
dev = ["research-proposal-app[persistence,llm,mcp,sources,ui,render,api]", "pillow>=10", "pytest>=8", "pytest-asyncio>=0.23", "pytest-xdist>=3.5",
       "ruff>=0.5", "import-linter>=2.0", "bandit>=1.7", "pip-audit>=2.7", "pre-commit>=3.7"]
ui = ["streamlit>=1.40"]

[project.scripts]
rra = "rra.entrypoints.cli:_entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rra"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# src 레이아웃을 명시해야 ruff 버전이 달라도 rra 를 1st-party 로 동일하게 분류한다.
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
per-file-ignores = { "tests/*" = ["S101", "S311"] }

# ── 계층 규칙 (import-linter) ─────────────────────────────
[tool.importlinter]
root_package = "rra"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain is pure"
type = "forbidden"
source_modules = ["rra.domain"]
forbidden_modules = ["rra.application", "rra.adapters", "rra.entrypoints", "rra.composition",
                     "rra.config_loader", "rra.settings",
                     "httpx", "sqlite3", "openai", "yaml", "fastapi", "mcp", "streamlit"]

[[tool.importlinter.contracts]]
name = "application depends only on domain"
type = "forbidden"
source_modules = ["rra.application"]
forbidden_modules = ["rra.adapters", "rra.entrypoints", "rra.composition", "rra.config_loader",
                     "rra.settings", "httpx", "sqlite3", "openai", "fastapi", "mcp", "streamlit"]

[[tool.importlinter.contracts]]
name = "adapters never import usecases or entrypoints"
type = "forbidden"
source_modules = ["rra.adapters"]
forbidden_modules = ["rra.application.usecases", "rra.application.services", "rra.entrypoints",
                     "rra.composition", "rra.config_loader", "rra.settings"]

# 진입점은 어댑터를 직접 고르지 않는다. 조립은 composition 만 한다.
# (composition 을 거치는 간접 경로는 허용해야 하므로 allow_indirect_imports)
[[tool.importlinter.contracts]]
name = "entrypoints reach adapters only through composition"
type = "forbidden"
source_modules = ["rra.entrypoints"]
forbidden_modules = ["rra.adapters"]
allow_indirect_imports = true

# 설정 로더는 yaml·Settings·domain 값 객체만 안다. 어댑터·유스케이스·진입점을 만들지 않는다.
[[tool.importlinter.contracts]]
name = "config_loader knows only settings and domain"
type = "forbidden"
source_modules = ["rra.config_loader"]
forbidden_modules = ["rra.application", "rra.adapters", "rra.entrypoints", "rra.composition",
                     "httpx", "sqlite3", "streamlit", "mcp", "fastapi"]

# REST 진입점은 어댑터를 직접 고르지 않고(composition 경유) 다른 진입점(ui·cli·mcp)을 빌리지 않는다.
[[tool.importlinter.contracts]]
name = "api reaches adapters only through composition and never other entrypoints"
type = "forbidden"
source_modules = ["rra.entrypoints.api"]
forbidden_modules = ["rra.adapters", "rra.entrypoints.ui", "rra.entrypoints.cli", "rra.entrypoints.mcp"]
allow_indirect_imports = true

# MCP 권한 경계: 읽기 도구는 생성(쓰기) 경로에 닿지 못한다.
[[tool.importlinter.contracts]]
name = "read-only MCP tools never reach the run manager"
type = "forbidden"
source_modules = ["rra.entrypoints.mcp.tools"]
forbidden_modules = ["rra.application.services", "rra.entrypoints.mcp.run_tools"]

# 화면(Streamlit)은 다른 진입점(CLI·MCP)의 코드를 빌리지 않는다. 공용 변환은 entrypoints/views 만.
[[tool.importlinter.contracts]]
name = "ui never imports other entrypoints"
type = "forbidden"
source_modules = ["rra.entrypoints.ui"]
forbidden_modules = ["rra.entrypoints.cli", "rra.entrypoints.mcp", "rra.adapters"]
allow_indirect_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
