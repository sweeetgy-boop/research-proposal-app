# 골든셋 8 — 수송수요·경영: 광역철도 단기 수요 예측 (연도별 수송수요 예측 과제와 겹침)
title_hint: 신설역 개통을 반영한 광역철도 월별 수송수요 예측 모형 개선
current_state: 광역철도 수송수요는 해마다 시계열 모형으로 다음 해 수요를 예측해 수송계획에 쓴다.
root_cause: 노선 연장과 신설역 개통이 잦아 과거 시계열만으로는 개통 초기 수요 변화를 반영하기 어렵다.
limitation: 신설역 수요는 별도 가정으로 보정해 예측 오차가 크고, 월별 변동은 연간 예측에서 다루지 않는다.
goal: 신설역 개통 효과와 월별 계절성을 함께 반영하는 광역철도 수송수요 예측 모형을 만들어 오차를 줄인다.
constraints: 공사 내부 수송 실적과 공개 통계만 사용, 8개월.
policy_basis: ""
beneficiaries: 경영연구처, 광역철도 운영 본부
