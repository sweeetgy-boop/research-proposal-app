# 골든셋 8 — 수송수요·경영: 광역철도 단기 수요 예측 (연도별 수송수요 예측 과제와 겹침)
title_hint: 신설역 개통을 반영한 광역철도 월별 수송수요 예측 모형 개선
current_state: 광역철도 수송수요는 해마다 시계열 모형으로 다음 해 수요를 예측해 수송계획에 쓴다.
