# 골든셋 2 — 사내 자산개발 공개 요약과 비슷한 아이디어 (유사과제 알림이 나야 하는 경우)
title_hint: 철도 유휴 부지·역사 공간을 활용한 자산개발 사업 다각화 방안
current_state: 공사의 자산개발 수익은 역세권 임대와 광고에 치우쳐 있고, 유휴 부지와 역사 상층부 활용은 개별 사업으로 흩어져 있다.
root_cause: 자산 현황이 부서별로 관리되어 전체 포트폴리오 관점의 평가와 우선순위가 없다.
limitation: 사업별 타당성 검토만 하고, 해외 철도회사 사례처럼 자산 유형별 수익 모델을 비교하지 않는다.
goal: 자산 유형별 수익 모델과 해외 철도회사 사례를 비교해 사업 다각화 포트폴리오와 추진 우선순위를 제안한다.
constraints: 공개 자료와 사내 자산 목록만 사용, 6개월.
policy_basis: ""
beneficiaries: 자산개발처
