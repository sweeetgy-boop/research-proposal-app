# 골든셋 9 — 역·고객 서비스: 역 주차장 정보와 규모 (스마트 주차안내·주차장 적정규모 과제와 겹침)
title_hint: 역 주차장 실시간 점유 정보와 이용 수요를 연계한 주차 안내·운영
current_state: 일부 역 주차장에 영상 분석으로 빈 주차면을 안내하는 서비스를 시범 도입했고, 주차장 규모는 별도 수요 연구로 산정한다.
root_cause: 점유 정보는 역별 안내에만 쓰이고, 시간대별 점유 이력이 주차장 규모 산정이나 요금·운영 정책에 연결되지 않는다.
limitation: 특정 시간대 만차와 다른 시간대 공차가 반복되지만 운영 정책을 바꿀 근거 자료가 없다.
goal: 주차면 점유 이력을 모아 시간대별 수요를 추정하고 안내·요금·개량 우선순위에 쓰는 운영 기준을 만든다.
constraints: 스마트 주차안내 시범역 2곳의 기존 데이터 활용, 6개월.
policy_basis: ""
beneficiaries: 역 운영 부서, 경영연구처
