# 골든셋 7 — 통신·신호: 열차 이상 자동 인식과 무선방호 (LTE-R 방호 기획·CCTV 열차감시 과제와 겹침)
title_hint: 열차 운행 정보와 영상으로 사고를 자동 인식해 방호 신호를 보내는 체계
current_state: 열차 사고 시 기관사가 비상 버튼으로 방호 신호를 보내고, 조차장에서는 CCTV로 주행장치 이상을 사람이 감시한다.
root_cause: 기관사 부상이나 판단 지연으로 방호 신호가 늦어질 수 있고, 영상 감시는 사람이 보는 범위에 한정된다.
limitation: 사고를 자동으로 인식해 해당 구역에만 방호 신호를 보내는 체계가 없어 2차 사고 위험과 불필요한 운행 지연이 함께 남는다.
goal: 차량 운행 정보와 CCTV 영상에서 사고·이상 상태를 자동 인식하고 LTE-R 망으로 해당 구역에 방호 신호를 보내는 체계를 설계한다.
constraints: 기획 연구, 현장 설치 없음, 12개월.
policy_basis: ""
beneficiaries: 안전 관련 부서, 전기·통신 사업소
