# 골든셋 5 — 차량 정비: 화차 차축베어링 상태 진단 (손상원인 분석·유간측정기 과제와 겹침)
title_hint: 운행 중 온도·진동 데이터를 이용한 화차 차축베어링 상태 진단
current_state: 화차 차축베어링은 정비 주기마다 분해 점검하고, 운행 중 이상은 지상 발열 감지기가 임계 온도를 넘을 때만 알린다.
root_cause: 베어링 손상은 하중 쏠림과 조립 간섭량 차이로 서서히 진행되는데, 주기 점검과 임계 온도 감지 사이에는 상태를 볼 수단이 없다.
limitation: 손상 초기 징후를 놓쳐 운행 중 차축 발열로 열차가 정차하거나, 멀쩡한 베어링까지 주기에 맞춰 교체한다.
goal: 발열 감지기 이력과 차량 진동 측정값을 묶어 베어링 상태 등급을 산정하고 정비 우선순위를 정한다.
constraints: 컨테이너 화차 20량 시범, 기존 지상 발열 감지기 데이터 활용, 12개월.
