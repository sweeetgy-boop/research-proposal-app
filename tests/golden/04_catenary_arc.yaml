# 골든셋 4 — 전철전력: 차량기지 전차선 급전장애(아크) 감지의 본선 확장 (공시 요약 기반 재구성, 정답 유사과제 있음)
title_hint: 본선 전차선 아크 영상·전류 복합 감지로 급전장애 구간 자동 특정
current_state: 차량기지 구내에서는 CCTV 영상으로 전차선 아크를 감지해 장애 구간을 알리는 장치를 쓰지만, 본선 구간의 급전장애는 변전소 트립 뒤 순회 점검으로 구간을 찾는다.
root_cause: 본선은 급전 구간이 길고 CCTV가 드문드문 있어 영상만으로는 아크 발생 지점을 좁히기 어렵고, 전류 파형은 별도로 기록만 된다.
limitation: 장애 발생 후 구간 특정까지 순회 시간이 들어 복구가 늦고, 영상 감지 장치는 기지 구내 전용이라 본선에 그대로 쓸 수 없다.
goal: 변전소 전류 파형과 역 구내 CCTV 영상을 함께 분석해 본선 급전장애 구간을 자동으로 특정하고 복구 소요시간을 줄인다.
constraints: 기존 설치 CCTV와 변전소 기록 장치만 사용, 시범 구간 1개 전기사업소, 18개월.
policy_basis: ""
beneficiaries: 전기사업소, 전철전력 유지보수 부서
