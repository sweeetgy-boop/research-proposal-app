# 골든셋 10 — 에너지·탄소중립: 철도 시설 분산에너지 (스마트에너지센터·분산에너지 인프라 기획과 겹침)
title_hint: 차량기지·변전소 유휴 부지의 분산에너지 설비 우선순위 평가
current_state: 공사는 전력을 전량 외부에서 구매하며, 스마트에너지센터와 분산에너지 인프라는 타당성·기획 연구 단계에 있다.
root_cause: 후보 부지마다 전력 사용 패턴과 설치 여건이 달라 어디부터 설비를 두어야 효과가 큰지 비교 기준이 없다.
limitation: 기획 연구는 전사 수준의 방향만 제시해 개별 부지의 투자 순서와 예상 절감액을 정하지 못한다.
goal: 부지별 전력 사용 이력과 설치 여건으로 분산에너지 설비의 투자 우선순위와 절감 효과를 산정하는 평가 체계를 만든다.
constraints: 공사 전력 사용 이력과 공개 자료만 사용, 10개월.
policy_basis: 분산에너지 활성화 특별법
beneficiaries: 전기 설비 부서, 경영연구처
