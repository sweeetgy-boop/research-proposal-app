# 골든셋 6 — 시설·궤도: 콘크리트궤도 도상균열 점검·보수 (자동검측 장비·보수재료 과제와 겹침)
title_hint: 콘크리트궤도 도상균열 진행 속도 추정과 보수 시점 결정
current_state: 콘크리트궤도 도상균열은 자동검측 장비로 균열 물량을 산출하고 보수재료로 주입 보수한다.
root_cause: 검측 결과가 회차별 사진·물량으로만 남아 같은 균열이 얼마나 빨리 자라는지 추적되지 않는다.
limitation: 보수는 균열 폭 기준으로 일괄 시행해 급격히 진행하는 균열과 정체된 균열을 구분하지 못한다.
goal: 회차별 검측 결과를 균열 단위로 연결해 진행 속도를 추정하고 보수 시점·우선순위를 정하는 기준을 만든다.
constraints: 기존 자동검측 장비 결과 데이터만 사용, 고속선 1개 구간, 예산 1억 원 이내.
policy_basis: ""
beneficiaries: 시설처, 고속시설사업소
