# 골든셋 1 — 궤도 틀림 상시 감지 (철도연구원 핵심 영역, 수집 자료에 근거가 있는 아이디어)
title_hint: 운행 차량 탑재 센서를 이용한 궤도 틀림 상시 감지
current_state: 경부선 일반철도 구간의 궤도 틀림(고저·방향·수평)은 궤도검측차가 분기별로 측정하고, 그 사이에는 점검원이 도보로 확인한다.
root_cause: 노반 상태와 열차 통과 톤수가 구간마다 달라 틀림 진행 속도가 다른데, 측정 주기가 일정해 급격히 진행하는 구간을 놓친다.
limitation: 임계치를 넘은 뒤에만 보수하므로 재발 구간을 반복 보수하고, 측정 사이 기간의 변화는 알 수 없다.
goal: 영업 차량에 탑재한 가속도 센서로 궤도 틀림 징후를 상시 감지하고, 진행 속도를 추정해 보수 우선순위를 정한다.
constraints: 1차년도 센서 설치 10편성, 기존 검측차 데이터와 대조 검증, 예산 2억 원 이내.
policy_basis: 국가철도망 구축계획의 철도 안전 강화 방향
beneficiaries: 시설처, 철도연구원
